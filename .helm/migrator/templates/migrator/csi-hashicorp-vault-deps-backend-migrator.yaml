{{- if .Values.vault_settings.hashicorp_vault }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "3"
spec:
  provider: vault
  secretObjects:
  - secretName: {{ .Values.secrets.deps_backend_migrator.secretName }}
    type: Opaque
    data:
      - key: user
        objectName: user
      - key: database-db
        objectName: database-db
      - key: database-user-secret
        objectName: database-user-secret
      - key: database-host
        objectName: database-host 
  parameters:
    roleName: {{ .Values.csi.roleName }}
    vaultAddress: "https://vault_host"
    vaultNamespace: "vault_namespace"
    vaultSkipTLSVerify: "true"
    #vaultCACertPath: ""
    vaultKubernetesMountPath: {{ .Values.csi.vaultKubernetesMountPath }}
    objects: |
      - objectName: "database-user-secret"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-backend"
        secretKey: "database-user-secret"

      - objectName: "database-db"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-backend"
        secretKey: "database-db"

      - objectName: "user"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/deps-backend"
        secretKey: "user"

      - objectName: "database-host"
        secretPath: "{{ .Values.csi.vault_namespace }}/data/common-secret"
        secretKey: "database-host"

{{- end }}
