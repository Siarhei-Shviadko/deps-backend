# Default values for deps-backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Secrets declaration
# Precreate them before deploy
# kubectl create secret generic app-secret-key --from-literal=app-secret-key='<APP_SECRET_KEY>'
# kubectl create secret generic database-host --from-literal=database-host='<DATABASE_HOST>'
# kubectl create secret generic database-user-secret --from-literal=database-user-secret='<database-user-password>'
# kubectl create secret generic database-work-user-secret --from-literal=database-work-user-secret='<database-work-user-secret>'
# kubectl create secret generic file-storage-external-url --from-literal=file-storage-external-url='<https://FRONTEND_URL/api/storage/v1/file>'
# kubectl create secret generic keycloak-certs-endpoint --from-literal=keycloak-certs-endpoint='<https://KEYCLOAK_URL/auth/realms/Test/protocol/openid-connect/certs>'
secrets:
  app_secret_key:
    secretName: app-secret-key
  file_storage_external_url:
    secretName: file-storage-external-url
  keycloak_certs_endpoint:
    secretName: keycloak-certs-endpoint
  common_secret:
    secretName: common-secret
  database_ssl_secret:
    secretName: database-ssl-secret
  deps_backend_migrator:
    secretName: deps-backend-migrator

helm_logs_job:
  serviceAccountName: gitlab-ci
  image:
    repository: ""
    path: "/base/kubernetes-helm"
    pullPolicy: IfNotPresent
    tag: "0.1.1"
  resources: {}

registry: ""
env: ""

backend:
  replicaCount: 1
  image:
    path: "/deps-dev-x01/deps-document-api"
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets: artifactory
  service:
    type: ClusterIP
    port: 8000
  resources: {}
  #    limits:
  #      cpu: 300m
  #      memory: 900Mi
  #    requests:
  #      cpu: 100m
  #      memory: 450Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

document_consumer:
  replicaCount: 1
  image:
    path: "/deps-dev-x01/deps-document-api"
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets: artifactory
  resources: {}
  #    limits:
  #      cpu: 100m
  #      memory: 850Mi
  #    requests:
  #      cpu: 80m
  #      memory: 600Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

migrator_update:
  image:
    path: "/deps-dev-x01/deps-document-api-migrator"
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets: artifactory
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

migrator_fixtures:
  image:
    path: "/deps-dev-x01/deps-document-api-migrator"
    pullPolicy: IfNotPresent
    tag: ""
  imagePullSecrets: artifactory
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

backend_settings:
  SECRET_KEY: test
  ENV: development
  # File Blob storage service
  FILE_STORAGE_MEDIA_ROOT: '/media/files/'
  FILE_STORAGE_URL: 'http://file-storage-nginx:8000'
  # Celery
  CELERY_BEAT_CRONTAB_INTERVAL: '60'
  # Validation service
  VALIDATION_API_URL: 'http://validation:8005'
  # Auth
  AUTH_VERIFY_SSL: 'false'
  CREATE_ROLE: deps-creator
  READ_ROLE: deps-reader
  WRITE_ROLE: deps-writer
  TEST_CLIENT_ID: TEST
  TEST_CLIENT_SECRET: TEST
  TEST_API_BASE_URL: TEST
  TEST_ACCESS_TOKEN_URL: TEST
  TEST_AUTHORIZE_URL: TEST
  # PostgreSQL
  DATABASE_PORT: '5432'
  # Priority (seconds)
  PRIORITY_MEDIUM_BOUNDARY: '3600'
  PRIORITY_HIGH_BOUNDARY: '10800'
  # Corleone
  CORLEONE_API_HOST: corleone
  CORLEONE_API_PORT: '8000'
  CORLEONE_API_ENDPOINT: '/api/corleone/v1'

  LOG_LEVEL: "INFO"

migrator:
  args: ''

migration_settings:
  DATABASE_PORT: '5432'
  DATABASE_REQUIRE_SECURE_TRANSPORT: false
  FILE_STORAGE_URL: 'http://file-storage-nginx:8000'
  DATABASE_SSLKEY_PATH: '/home/dbcerts/tls.key'
  DATABASE_SSLCERT_PATH: '/home/dbcerts/tls.crt'
  DATABASE_SSLROOTCERT_PATH: '/home/dbcerts/root.crt'

helm:
  enabled: false

certs_location:
  database_sslcerts_path: "/home/dbcerts"

csi:
  csi_default_name: deps-backend-migrator
  vault_namespace: 'k8s-dev'
  roleName: 'k8s-dev'
  vaultKubernetesMountPath: 'kubernetes-dev'

secrets_location:
  secrets_default_path: "/mnt/secrets-store"

service_account:
  serviceAccountName: 'deps-develop'

secret_project_id:
  id: ""

azure_kv_settings:
  keyvaultName: ""
  tenantId: ""
  userAssignedIdentityID: ""
  resourceGroup: ""
  subscriptionId: ""

# Enabled vault settings means that secrets are pulled from hashicorp vault server. Turn off this setting by changing true to false if you are using this repo in another project. If you haven't integrated your cluster with vault deploy won't work.
vault_settings:
  enabled: false
  hashicorp_vault: false
  azure_key_vault: false
  gcp_secret_manager: false
  aws_secret_manager: false
  aws_secret_manager_region: ''

vault_enabled_migrator:
  env:
  - name: DATABASE_HOST
    valueFrom:
      secretKeyRef:
        name: deps-backend-migrator
        key: db-host
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: deps-backend-migrator
        key: document-db-password
  - name: DATABASE_USER
    valueFrom:
      secretKeyRef:
        name: deps-backend-migrator
        key: document-db-user
  - name: DATABASE_DB
    valueFrom:
      secretKeyRef:
        name: deps-backend-migrator
        key: document-db

vault_disabled_migrator:
  env:
  - name: DATABASE_HOST
    valueFrom:
      secretKeyRef:
        name: common-secret
        key: database-host
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: deps-database
        key: password
  - name: DATABASE_USER
    valueFrom:
      secretKeyRef:
        name: deps-database
        key: user
  - name: DATABASE_DB
    valueFrom:
      secretKeyRef:
        name: deps-database
        key: database-db
