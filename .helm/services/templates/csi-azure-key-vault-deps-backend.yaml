{{- if .Values.vault_settings.azure_key_vault }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
spec:
  provider: azure
  secretObjects:
  - data:
    - key: api-key
      objectName: api-key
    - key: app-secret-key
      objectName: app-secret-key
    - key: document-db-password
      objectName: document-db-password
    - key: document-db
      objectName: document-db
    - key: document-db-user
      objectName: document-db-user
    - key: file-storage-external-url
      objectName: file-storage-external-url
    - key: kafka-sasl-password
      objectName: kafka-sasl-password
    - key: kafka-sasl-username
      objectName: kafka-sasl-username
    - key: keycloak-certs-endpoint
      objectName: keycloak-certs-endpoint
    - key: rabbitmq-password
      objectName: rabbitmq-password
    - key: redis-password
      objectName: redis-password
    - key: access-mode
      objectName: access-mode
    - key: auth-enabled
      objectName: auth-enabled
    - key: db-host
      objectName: db-host
    - key: message-broker-connection-string
      objectName: message-broker-connection-string
    - key: message-broker-driver
      objectName: message-broker-driver
    secretName: {{ .Values.secrets.deps_backend.secretName }}
    type: Opaque
  parameters:
    keyvaultName: {{ .Values.azure_kv_settings.keyvaultName }}
    tenantId: {{ .Values.azure_kv_settings.tenantId }}
    vaultKubernetesMountPath: {{ .Values.csi.vaultKubernetesMountPath }}
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.azure_kv_settings.userAssignedIdentityID }}  
    resourceGroup:  {{ .Values.azure_kv_settings.resourceGroup }}
    subscriptionId: {{ .Values.azure_kv_settings.subscriptionId }}
    objects: |
      array:
        - |
          objectName: "api-key"
          objectType: secret
      
        - |
          objectName: "app-secret-key"
          objectType: secret
      
        - |
          objectName: "document-db-password"
          objectType: secret
      
        - |
          objectName: "document-db-user"
          objectType: secret
      
        - |
          objectName: "document-db"
          objectType: secret
      
        - |
          objectName: "file-storage-external-url"
          objectType: secret
      
        - |
          objectName: "kafka-sasl-password"
          objectType: secret
      
        - |
          objectName: "kafka-sasl-username"
          objectType: secret
      
        - |
          objectName: "keycloak-certs-endpoint"
          objectType: secret
      
        - |
          objectName: "rabbitmq-password"
          objectType: secret
      
        - |
          objectName: "redis-password"
          objectType: secret
      
        - |
          objectName: "access-mode"
          objectType: secret
      
        - |
          objectName: "auth-enabled"
          objectType: secret
      
        - |
          objectName: "db-host"
          objectType: secret
      
        - |
          objectName: "message-broker-connection-string"
          objectType: secret
      
        - |
          objectName: "message-broker-driver"
          objectType: secret
{{- end }}

