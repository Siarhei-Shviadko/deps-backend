podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

certs_location:
  certs_default_path: "/tmp/ssl"
  
  database_sslcerts_path: "/home/dbcerts"


backend_settings:
  SECRET_KEY: test
  ENV: dev
  # File Blob storage service
  FILE_STORAGE_MEDIA_ROOT: '/media/files/'
  FILE_STORAGE_URL: 'http://file-storage-nginx:8000'

  OBJECT_STORAGE_MODE: "sync"
  OBJECT_STORAGE_TYPE: "file-storage"

  S3_BUCKET_NAME: bucket_name
  S3_ENDPOINT_URL: https://s3.us-east-1.amazonaws.com

  GCP_BLOB_STORAGE_BUCKET_NAME: ""

  # Validation service
  VALIDATION_API_URL: 'http://validation:8005'
  # Auth
  AUTH_VERIFY_SSL: 'false'
  CREATE_ROLE: deps-creator
  READ_ROLE: deps-reader
  WRITE_ROLE: deps-writer
  TEST_CLIENT_ID: TEST
  TEST_CLIENT_SECRET: TEST
  TEST_API_BASE_URL: TEST
  TEST_ACCESS_TOKEN_URL: TEST
  TEST_AUTHORIZE_URL: TEST
  REVIEWER_REASSIGN_ENABLED: 'false'
  # PostgreSQL
  DATABASE_PORT: '5432'
  DATABASE_DIALECT: postgresql
  DATABASE_DRIVER: psycopg2
  DATABASE_REQUIRE_SECURE_TRANSPORT: false
  DATABASE_SSLKEY_PATH: "/home/dbcerts/tls.key"
  DATABASE_SSLCERT_PATH: "/home/dbcerts/tls.crt"
  DATABASE_SSLROOTCERT_PATH: "/home/dbcerts/root.crt"
  # Redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  # Priority (seconds)
  PRIORITY_MEDIUM_BOUNDARY: '3600'
  PRIORITY_HIGH_BOUNDARY: '10800'
  # Corleone
  CORLEONE_API_HOST: corleone
  CORLEONE_API_PORT: '8000'
  CORLEONE_API_ENDPOINT: '/api/corleone/v1'

  LOG_LEVEL: "INFO"
  PARSING_ENABLED: 'true'
  DOCUMENTATION_ENABLED: 'true'

  # RabitMQ
  RABBITMQ_TLS_ENABLED: false
  RABBITMQ_TLS_DLX_PER_QUEUE: false
  RABBITMQ_TLS_CONSUMER_STRATEGY: 'AVAILABILITY'

  KAFKA_GROUP_ID: documents
  KAFKA_SECURITY_ENABLED: false

  # Auto validation
  AUTO_VALIDATION_ENABLED: 'false'

  # Azure Service Bus
  ASB_SUBSCRIPTION_STRATEGY: 'no_preparation'
  ASB_TOPIC_NAME: 'deps-topic' 
  message_broker_asb_without_manage_permission: false

  # Telemetry
  INSTRUMENTATION_ENABLED: false
  SERVICE_NAME: deps-documents
  EXPORTER_TYPE: azure

migration_settings:
  DATABASE_PORT: '5432'
  FILE_STORAGE_URL: 'http://file-storage-nginx:8000'

helm:
  helm_logs_job_enabled: false

csi:
