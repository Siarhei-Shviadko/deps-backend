azure_kv_settings:
  keyvaultName: ""
  tenantId: ""
  userAssignedIdentityID: ""
  resourceGroup: ""
  subscriptionId: ""

# Enabled vault settings means that secrets are pulled from hashicorp vault server. Turn off this setting by changing true to false if you are using this repo in another project. If you haven't integrated your cluster with vault deploy won't work.
vault_settings:
  enabled: false
  hashicorp_vault: false
  azure_key_vault: false
  gcp_secret_manager: false
  aws_secret_manager: false
  aws_secret_manager_region: ''

