helm_logs_job:
  serviceAccountName: gitlab-ci
  image:
    path: "/base/kubernetes-helm"
  resources: {}

backend:
  image:
    path: "/deps-platform/deps-document-api"
  resources: {}

document_consumer:
  image:
    path: "/deps-platform/deps-document-api"
  resources: {}

migrator_update:
  image:
    path: "/deps-platform/deps-document-api-migrator"

migrator_fixtures:
  image:
    path: "/deps-platform/deps-document-api-migrator"

backend_settings:
  ENV: demo
  # PostgreSQL
  DATABASE_PORT: '5432'
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

  OBJECT_STORAGE_TYPE: aws
  S3_BUCKET_NAME: bucket_name
  S3_ENDPOINT_URL: https://s3.us-east-1.amazonaws.com


  LOG_LEVEL: "INFO"

migration_settings:
  DATABASE_PORT: '5432'
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

  FILE_STORAGE_URL: 'http://file-storage-nginx:8000'

helm: 
  helm_logs_job_enabled: false

csi:
  vault_namespace: 'k8s-demo'
  roleName: 'k8s-demo'
  vaultKubernetesMountPath: 'kubernetes-demo'

service_account:
  serviceAccountName: 'deps-demo'
