databaseChangeLog:
- changeSet:
    id: 1
    author: Viktoriya Kaleda
    changes:
    - createTable:
        columns:
        - column:
            autoIncrement: true
            constraints:
              primaryKey: true
              primaryKeyName: comment_pkey
            name: id
            type: SERIAL
        - column:
            name: document_id
            type: INTEGER
        - column:
            name: text
            type: VARCHAR
        - column:
            name: created_at
            type: TIMESTAMP WITHOUT TIME ZONE
        - column:
            name: email
            type: VARCHAR
        - column:
            name: first_name
            type: VARCHAR
        - column:
            name: last_name
            type: VARCHAR
        tableName: comment
- changeSet:
    id: 2
    author: Viktoriya Kaleda
    changes:
    - createTable:
        columns:
        - column:
            autoIncrement: true
            constraints:
              primaryKey: true
              primaryKeyName: document_pkey
            name: id
            type: SERIAL
        - column:
            name: document_part_number
            type: INTEGER
        - column:
            defaultValueComputed: "'{}'::integer[]"
            name: related_document_ids
            type: INTEGER[]
        - column:
            name: title
            type: VARCHAR
        - column:
            name: state
            type: VARCHAR
        - column:
            name: file
            type: JSONB
        - column:
            name: document_type
            type: VARCHAR
        - column:
            name: date
            type: TIMESTAMP WITH TIME ZONE
        - column:
            name: reviewer
            type: VARCHAR
        - column:
            name: scraped_api_number
            type: VARCHAR
        - column:
            name: preview_images
            type: JSONB
        - column:
            name: extracted_data
            type: JSONB
        - column:
            name: validation_succeeded
            type: BOOLEAN
        - column:
            name: validation_errors
            type: JSONB
        - column:
            name: validation_warnings
            type: JSONB
        - column:
            name: error_description
            type: VARCHAR
        - column:
            name: error_in_state
            type: VARCHAR
        - column:
            name: source_code
            type: VARCHAR
        - column:
            name: files
            type: JSONB
        tableName: document
- changeSet:
    id: 3
    author: Viktoriya Kaleda
