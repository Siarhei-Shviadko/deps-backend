            type: VARCHAR
        - column:
            name: current
            type: VARCHAR
        - column:
            name: created_at
            type: TIMESTAMP WITHOUT TIME ZONE
        - column:
            name: actor
            type: VARCHAR
        tableName: document_log
- changeSet:
    id: 4
    author: Viktoriya Kaleda
    changes:
    - createTable:
        columns:
        - column:
            constraints:
              primaryKey: true
              primaryKeyName: document_type_pkey
            name: code
            type: VARCHAR
        - column:
            constraints:
              nullable: false
            name: name
            type: VARCHAR
        - column:
            constraints:
              nullable: false
            defaultValue: TESSERACT
            name: engine
            type: VARCHAR
        tableName: document_type
- changeSet:
    id: 5
    author: Viktoriya Kaleda
    changes:
    - createTable:
        columns:
        - column:
            constraints:
              primaryKey: true
