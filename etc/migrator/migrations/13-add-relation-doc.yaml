databaseChangeLog:
  - changeSet:
      id: 1
      author: Andrei Miadzvedzeu
      changes:
        - createTable:
            tableName: relation_type
            columns:
              - column:
                  name: type
                  type: VARCHAR
                  constraints:
                    primaryKey: true
                    primaryKeyName: type_pkey
  - changeSet:
      id: 2
      author: Andrei Miadzvedzeu
      changes:
        - createTable:
            tableName: relation
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: relation_pkey
                  name: id
                  type: SERIAL
              - column:
                  name: unique_key
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: created
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated
                  type: TIMESTAMP WITHOUT TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: metadata
                  type: JSONB
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            columnNames: unique_key, type
            tableName: relation
        - addDefaultValue:
            tableName: relation
            columnName: created
            defaultValueComputed: CURRENT_TIMESTAMP
        - addDefaultValue:
            tableName: relation
            columnName: updated
            defaultValueComputed: CURRENT_TIMESTAMP
        - addDefaultValue:
            tableName: relation
            columnName: metadata
            defaultValueComputed: "'{}'::jsonb"
        - addForeignKeyConstraint:
            baseColumnNames: type
            baseTableName: relation
            constraintName: fk_relation_type
            onDelete: CASCADE
            referencedColumnNames: type
            referencedTableName: relation_type
  - changeSet:
      id: 3
      author: Andrei Miadzvedzeu
      changes:
        - createTable:
            tableName: document_relation_through
            columns:
              - column:
                  name: document_id
                  type: INTEGER
              - column:
                  name: relation_id
                  type: INTEGER
        - addForeignKeyConstraint:
            baseColumnNames: document_id
            baseTableName: document_relation_through
            constraintName: fk_document
            onDelete: CASCADE
            referencedColumnNames: id
            referencedTableName: document
        - addForeignKeyConstraint:
            baseColumnNames: relation_id
            baseTableName: document_relation_through
            constraintName: fk_relation
            onDelete: CASCADE
            referencedColumnNames: id
            referencedTableName: relation
