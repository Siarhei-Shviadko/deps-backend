databaseChangeLog:
- changeSet:
    id: 1
    author: Valentin Vorobyev
    changes:
    - createTable:
        columns:
        - column:
            name: document_id
            type: INTEGER
        - column:
            name: organisation_name
            type: VARCHAR
        tableName: organisation_has_document
- changeSet:
    id: 2
    author: Valentin Vorobyev
    changes:
    - addForeignKeyConstraint:
        baseColumnNames: document_id
        baseTableName: organisation_has_document
        constraintName: organisation_has_document_document_id_fkey
        deferrable: false
        initiallyDeferred: false
        onDelete: CASCADE
        onUpdate: NO ACTION
        referencedColumnNames: id
        referencedTableName: document
        validate: true
