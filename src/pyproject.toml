[tool.poetry]
name = "deps-documents"
version = "0.2.0"
description = "Document service api"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "~3.12"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.1"
click = "^8.1.3"
SQLAlchemy = "1.3.12"
Authlib = ">=1.6.9"

deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq", "deps-integrations"], develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }
deps-object-storage = { path = "../vendors/deps-object-storage", develop = true }

fastapi = "^0.120"
starlette = "^0.49.1"
dependency-injector = "^4.48.0"
uvicorn = "^0.18.3"
psycopg2-binary = "^2.9"
redis = "^5.2.0"
python-multipart = "^0.0.22"
botocore = ">=1.34"
boto3 = ">=1.34"
fastapi-csrf-protect = "^0.3.0"
pycurl = "7.45.3"
types-python-dateutil = "^2.8.0"
bandit = "^1.7.5"
urllib3 = "^2.6.3"
aiohttp = "^3.13.3"
pyasn1 = "^0.6.2"
azure-core = "1.38.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.5.1"
flake8 = "^6.1.0"
wemake-python-styleguide = "^0.18.0"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
coverage = "^5.5"
factory-boy = "^3.2.0"
pytest-factoryboy = "^2.1.0"
pytest-mock = "~3.7.0"
pytest-faker = "2.0.0"
requests-mock = "~1.9.3"
Faker = "8.12.1"
types-redis = "^4.6.0"
types-requests = "^2.30"
httpx = "^0.27"

wdb = "^3.3.0"
ipdb = "^0.13.13"
# setuptools 82+ dropped pkg_resources; flake8-commas 2.x (pulled by wemake-python-styleguide) still imports it for flake8 plugins.
setuptools = ">=70,<82"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.extras]
datasource = ["datasource"]

[tool.black]
line-length = 130
target-version = ['py312']
exclude = '''
(
    .venv
    | vendors
)
'''
