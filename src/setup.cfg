[tool:pytest]
rootdir = .
cache_dir = /tmp/test_cache/.pytest_cache

filterwarnings =
    ignore::UserWarning
    ignore::FutureWarning
    ignore::DeprecationWarning

[flake8]
ignore=
    # Class without a base class
    WPS306,
    # Found `f` string
    WPS305
    # Remove all docstring rules
    D,
    # Remove bad quotes
    Q000,
    # Found empty comment
    WPS464,
    # Found local folder import
    WPS300,
    # Found `__init__.py` module with logic
    WPS412,
    # Found `else` in a loop without `break`
    WPS500,
    # Found too short name: x
    WPS111,
    # Found function with too much cognitive complexity NEED TO GOOGLE AND SET COGNITIVE
    WPS231,
    # Found incorrectly nested ternary
    WPS509,
    # Found too many imported names from a module
    WPS235,
    # Found string constant over-use
    WPS226,
    # Found a line that starts with a dot
    WPS348,
    # Found multiline conditions
    WPS337,
    # Found module with too many imports
    WPS201,
    # Found using `@staticmethod`
    WPS602,
    # Requests call with verify=False disabling SSL certificate checks, security issue
    S501,
    # Found too long ``try`` body length
    WPS229,
    # line break before binary operator
    W503,
    # Found a too complex `f` string
    WPS237,
    # Found a getter without a return value
    WPS463,
    # Found subclassing a builtin: str
    WPS600,
    # Do not perform function calls in argument defaults. This rule prevents us from using the recommended style of dependency_injector
    B008,
    # Found too many arguments
    WPS211,
    # Found complex default value
    WPS404,
    # Found nested class: Config
    WPS431,
    # Found too many expressions
    WPS213,
    # Found upper-case constant in a class
    WPS115,
    # Found executable mismatch: file is executable but no shebang is present
    WPS453,
    # Too many classes in a file
    WPS202,
    # Found string formatting
    WPS323,
    # Found wrong metadata variable: __all__
    WPS410,
    # used; unable to detect undefined names
    F403,
    # Found vague import that may cause confusion: *
    WPS347,
    F405,
    # Found block variables overlap: *
    WPS440,
    # Found direct magic attribute usage: __all__
    WPS609,
    # Found walrus operator
    WPS332,
    N818,
    WPS467,
    WPS473,
    # Found overused expression
    WPS204,
    # Found module with too many imported names
    WPS203,


allowed-domain-names =
    value,  # We allow using 'value' name when creating dictionaries
    values, # pydantic validator
    file,   # We are working with files
    data,   # We use name 'data' in our models
    info    # We use it in settings
max-line-length = 130
max-module-expressions = 10
max-line-complexity = 20
max-local-variables = 10
max-methods = 10
exclude =
    .git,
    __pycache__,
    tests,
    vendors,
    .venv

per-file-ignores =
  */__init__.py: F401
  # nested imports are required (433)
  ./deps_documents/app.py: WPS433 WPS202
  ./deps_documents/__main__.py: WPS420 WPS433
  ./deps_documents/config.py: WPS202
  ./deps_documents/containers.py: WPS202 WPS203
  ./deps_documents/domain/interfaces/*: WPS420 WPS214 F401
  ./deps_documents/domain/exceptions/*: WPS202 WPS326 WPS203 F401
  ./deps_documents/domain/constants.py: WPS407 WPS202 WPS114 P103
  ./deps_documents/domain/dtos.py: WPS202 WPS234 WPS110
  ./deps_documents/domain/entities/document.py: WPS230 WPS214 WPS202
  ./deps_documents/domain/services/*: WPS214
  ./deps_documents/domain/services/__init__.py: F401
  ./deps_documents/domain/services/document:py: WPS210 WPS203
  ./deps_documents/infrastructure/access_management/document_access_manager.py: WPS420
  ./deps_documents/infrastructure/access_management/label_access_manager.py: WPS420
  ./deps_documents/infrastructure/access_management/document_service_accessor.py: WPS214 WPS204
  ./deps_documents/infrastructure/repositories/helpers.py: WPS100
  ./deps_documents/infrastructure/document_uow.py: WPS214
  ./deps_documents/domain/events/events.py: WPS202
  ./deps_documents/events_handler/handlers.py: WPS202
  ./deps_documents/events_handler/consumer.py: WPS221, WPS203
  ./deps_documents/events_handler/command_handlers/reply_builder_dec.py: WPS232, WPS430, WPS220
  ./deps_documents/extras/*: S105, WPS420, WPS604, WPS112, WPS615, WPS110, WPS430, WPS220, WPS331, WPS516, WPS437, WPS601, WPS326, WPS503, WPS338, WPS214, WPS608, P101, WPS433, WPS232, S113, B019, WPS425, N805
  
[mypy]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False
disable_error_code = attr-defined, name-defined

[mypy-tests.*]
ignore_errors = True

[isort]
profile = black
multi_line_output = 3
skip =
    vendors
   .venv

[coverage:run]
omit =
    tests/*
    domain/entities/*
    */__init__.py
    app.py
    config.py
    containers.py
    database.py
    domain/constants.py
    domain/dtos.py
    domain/exceptions.py
    domain/interfaces/*
    /app/.venv/*
    /vendors/*
branch = True
data_file=/tmp/test_cache/.coverage

[coverage:report]
fail_under = 80
